    }

    .blue {
      background: #1268c4;
    }

      background: #0b3d91;
      color: white;
      padding: 14px 18px;
      margin: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #d8e0e8;
      padding: 13px;
      text-align: left;
    }

    th {
      width: 38%;
      background: #eef4fa;

    ul,
    ol {
      padding: 20px 40px;
    }

    li {
      margin-bottom: 9px;

    .warning {
      background: #fff3cd;
      border-left: 5px solid #ff9800;
      padding: 15px;
      margin-top: 20px;
    }

    footer {
      margin-top: 30px;
      background: #082c68;

      text-align: center;
      padding: 30px;
    }

      <li>Educational qualification: See the official notification.</li>

    <p>Selection stages depend on the recruitment. Always verify the current official notification.</p>
  </section>

    <ol>
